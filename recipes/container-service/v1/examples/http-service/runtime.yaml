apiVersion: recipe.brotni.com/v1
kind: ContainerServiceRecipe

metadata:
  name: http-service-candidate
  description: HTTP service candidate with health check and port exposure.

candidate:
  image: registry.example.com/http-service@sha256:replace-with-digest
  source:
    provider: github
    repository: example/http-service
    commit: replace-with-commit-sha

runtime:
  command: ["./http-service"]
  args: ["--mode=simulation"]
  env:
    MODE: simulation
    PORT: "8080"
  ports:
    - name: http
      containerPort: 8080

healthcheck:
  http:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  timeoutSeconds: 60

resources:
  cpu: "250m"
  memory: "256Mi"

timeouts:
  startupSeconds: 60
  runSeconds: 300
  shutdownSeconds: 15

reproducibility:
  requireImmutableImage: true
  recordEnvironment: true
