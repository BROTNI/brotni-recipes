apiVersion: recipe.brotni.com/v1
kind: ContainerServiceRecipe

metadata:
  name: http-service-valid

candidate:
  image: registry.example.com/http-service@sha256:replace-with-digest

runtime:
  command: ["./http-service"]
  env:
    PORT: "8080"
  ports:
    - name: http
      containerPort: 8080

healthcheck:
  http:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  timeoutSeconds: 60
