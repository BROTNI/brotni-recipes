apiVersion: recipe.brotni.com/v1
kind: ConfigBundleRecipe

metadata:
  name: routing-config-v7
  description: >
    Full config-bundle recipe — a routing policy candidate evaluated as a
    behaviour change driven only by configuration.

configuration:
  format: yaml
  appliesTo: routing-service
  digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  data: |
    router:
      strategy: weighted-latency
      weights:
        latency: 0.6
        cost: 0.4
      max_retries: 2
  source:
    provider: github
    repository: brotni/brotni-api
    commit: abc123def456

validation:
  schema: schemas/routing-config.schema.json
  rules:
    - name: retries-bounded
      expression: "router.max_retries <= 3"
      severity: blocking
    - name: strategy-known
      expression: "router.strategy in ['weighted-latency','round-robin']"
      severity: blocking

apply:
  mountPath: /brotni/input/config.yaml
  envPrefix: ROUTING_
  reloadCommand: ["/bin/sh", "-c", "kill -HUP 1"]

outputs:
  metrics:
    path: /brotni/output/metrics.json
    format: json
  decisions:
    path: /brotni/output/decisions.ndjson
    format: ndjson
  logs:
    path: /brotni/output/logs.txt
    format: text

timeouts:
  runSeconds: 1800

reproducibility:
  requireDigest: true
  recordConfigDigest: true
