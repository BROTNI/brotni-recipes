name: Validate Recipes

on:
  push:
    paths:
      - 'recipes/**'
      - 'scripts/validate-recipes.sh'
  pull_request:
    paths:
      - 'recipes/**'
      - 'scripts/validate-recipes.sh'

jobs:
  validate:
    name: Validate recipe schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Run validation
        run: bash scripts/validate-recipes.sh